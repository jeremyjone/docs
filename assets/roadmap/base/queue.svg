<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <text x="200" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">队列 — 先进先出（FIFO）</text>

  <!-- 队列容器 -->
  <rect x="40" y="130" width="320" height="70" rx="6" fill="none" stroke="#5a6a7a" stroke-width="2"/>

  <!-- 队首标记 -->
  <text x="55" y="120" text-anchor="middle" fill="#4caf50" font-size="13" font-weight="bold">队首 ← dequeue</text>
  <line x1="55" y1="125" x2="55" y2="130" stroke="#4caf50" stroke-width="1.5"/>

  <!-- 队尾标记 -->
  <text x="345" y="120" text-anchor="middle" fill="#ff7043" font-size="13" font-weight="bold">队尾 ← enqueue</text>
  <line x1="345" y1="125" x2="345" y2="130" stroke="#ff7043" stroke-width="1.5"/>

  <!-- 队列元素 -->
  <rect x="50" y="140" width="55" height="50" rx="4" fill="#2e7d32" stroke="#4caf50" stroke-width="1.5"/>
  <text x="77" y="170" text-anchor="middle" fill="#a5d6a7" font-size="14">A出队</text>

  <rect x="110" y="140" width="55" height="50" rx="4" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="137" y="170" text-anchor="middle" fill="#90caf9" font-size="14">B</text>

  <rect x="170" y="140" width="55" height="50" rx="4" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="197" y="170" text-anchor="middle" fill="#90caf9" font-size="14">C</text>

  <rect x="230" y="140" width="55" height="50" rx="4" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="257" y="170" text-anchor="middle" fill="#90caf9" font-size="14">D</text>

  <rect x="290" y="140" width="55" height="50" rx="4" fill="#4a2a1a" stroke="#ff7043" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="317" y="170" text-anchor="middle" fill="#ffab91" font-size="14">E入队</text>

  <!-- 箭头方向 -->
  <text x="200" y="220" text-anchor="middle" fill="#5a6a7a" font-size="24">→</text>
  <text x="200" y="237" text-anchor="middle" fill="#6a7a8a" font-size="11">数据流动方向</text>

  <!-- 生活类比 -->
  <rect x="50" y="260" width="300" height="70" rx="6" fill="#1a2a3a" stroke="#4a5a6a" stroke-width="1"/>
  <text x="200" y="282" text-anchor="middle" fill="#b0bec5" font-size="13">就像排队做核酸</text>
  <text x="200" y="300" text-anchor="middle" fill="#6a7a8a" font-size="11">先来的人先做，后来的人排在队尾</text>
  <text x="200" y="316" text-anchor="middle" fill="#6a7a8a" font-size="11">对应：任务调度、消息队列、BFS</text>
</svg>