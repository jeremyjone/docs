<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">数组 vs 链表</text>

  <!-- ============ 数组部分 ============ -->
  <text x="200" y="65" text-anchor="middle" fill="#64b5f6" font-size="15" font-weight="bold">数组（连续内存）</text>

  <!-- 内存格子 -->
  <rect x="25" y="80" width="60" height="45" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="55" y="107" text-anchor="middle" fill="#90caf9" font-size="13">10</text>

  <rect x="85" y="80" width="60" height="45" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="115" y="107" text-anchor="middle" fill="#90caf9" font-size="13">20</text>

  <rect x="145" y="80" width="60" height="45" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="175" y="107" text-anchor="middle" fill="#90caf9" font-size="13">30</text>

  <rect x="205" y="80" width="60" height="45" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="235" y="107" text-anchor="middle" fill="#90caf9" font-size="13">40</text>

  <rect x="265" y="80" width="60" height="45" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="295" y="107" text-anchor="middle" fill="#90caf9" font-size="13">50</text>

  <!-- 地址标注 -->
  <text x="55" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">0x00</text>
  <text x="115" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">0x01</text>
  <text x="175" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">0x02</text>
  <text x="235" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">0x03</text>
  <text x="295" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">0x04</text>

  <!-- 访问箭头 -->
  <text x="55" y="170" text-anchor="middle" fill="#4caf50" font-size="11">arr[2] → O(1)</text>

  <!-- 插入箭头 -->
  <text x="235" y="195" text-anchor="middle" fill="#ff7043" font-size="11">插入/删除 → O(n)</text>

  <!-- 插入标红 -->
  <rect x="205" y="80" width="60" height="45" rx="3" fill="#3a1a1a" stroke="#ff7043" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 插入箭头线 -->
  <line x1="235" y1="190" x2="235" y2="128" stroke="#ff7043" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ============ 分割线 ============ -->
  <line x1="350" y1="60" x2="350" y2="350" stroke="#3a4a5a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ============ 链表部分 ============ -->
  <text x="575" y="65" text-anchor="middle" fill="#81c784" font-size="15" font-weight="bold">链表（非连续内存）</text>

  <!-- 节点 1: 10 -->
  <rect x="380" y="80" width="55" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="407" y="105" text-anchor="middle" fill="#a5d6a7" font-size="13">10</text>

  <!-- 箭头区域 -->
  <rect x="435" y="80" width="20" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="445" y="105" text-anchor="middle" fill="#5a8a6a" font-size="10">→</text>

  <!-- 箭头线 -->
  <line x1="455" y1="100" x2="490" y2="100" stroke="#81c784" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="490,95 498,100 490,105" fill="#81c784"/>

  <!-- 节点 2: 20 -->
  <rect x="498" y="80" width="55" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="525" y="105" text-anchor="middle" fill="#a5d6a7" font-size="13">20</text>
  <rect x="553" y="80" width="20" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="563" y="105" text-anchor="middle" fill="#5a8a6a" font-size="10">→</text>

  <!-- 分散的节点 3: 30（下方） -->
  <rect x="470" y="150" width="55" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="497" y="175" text-anchor="middle" fill="#a5d6a7" font-size="13">30</text>
  <rect x="525" y="150" width="20" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="535" y="175" text-anchor="middle" fill="#5a8a6a" font-size="10">→</text>

  <!-- 从20到30的箭头 -->
  <line x1="563" y1="110" x2="540" y2="145" stroke="#81c784" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- 节点 4: 40 -->
  <rect x="380" y="220" width="55" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="407" y="245" text-anchor="middle" fill="#a5d6a7" font-size="13">40</text>
  <rect x="435" y="220" width="20" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="445" y="245" text-anchor="middle" fill="#5a8a6a" font-size="10">→</text>

  <!-- 从30到40的箭头 -->
  <line x1="535" y1="180" x2="462" y2="215" stroke="#81c784" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- 节点 5: 50 -->
  <rect x="498" y="220" width="55" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="525" y="245" text-anchor="middle" fill="#a5d6a7" font-size="13">50</text>
  <rect x="553" y="220" width="20" height="40" rx="4" fill="#1a3a2a" stroke="#81c784" stroke-width="1.5"/>
  <text x="563" y="245" text-anchor="middle" fill="#5a8a6a" font-size="10">∅</text>

  <!-- 从40到50的箭头 -->
  <line x1="455" y1="240" x2="495" y2="240" stroke="#81c784" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- 访问标注 -->
  <text x="575" y="195" text-anchor="middle" fill="#ff7043" font-size="11">访问 → O(n)</text>

  <!-- 插入标注 -->
  <text x="575" y="280" text-anchor="middle" fill="#4caf50" font-size="11">插入/删除 → O(1)</text>

  <!-- 底部总结 -->
  <rect x="50" y="310" width="700" height="50" rx="6" fill="#1a2a3a" stroke="#4a5a6a" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" fill="#b0bec5" font-size="13">数组：随机访问快，插入删除慢 ｜ 链表：插入删除快，随机访问慢</text>
  <text x="400" y="350" text-anchor="middle" fill="#6a7a8a" font-size="11">选择依据：数据多大？读多写少还是写多读少？</text>
</svg>