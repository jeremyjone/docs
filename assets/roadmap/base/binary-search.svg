<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <text x="300" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">二分查找 — 在有序数组中找 23</text>

  <!-- 数组原始状态 -->
  <text x="50" y="60" fill="#6a7a8a" font-size="13">原始有序数组：</text>

  <rect x="50" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="75" y="93" text-anchor="middle" fill="#90caf9" font-size="14">2</text>
  <rect x="100" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="125" y="93" text-anchor="middle" fill="#90caf9" font-size="14">8</text>
  <rect x="150" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="175" y="93" text-anchor="middle" fill="#90caf9" font-size="14">13</text>
  <rect x="200" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="225" y="93" text-anchor="middle" fill="#90caf9" font-size="14">18</text>
  <rect x="250" y="70" width="50" height="36" rx="3" fill="#1a5a3a" stroke="#4caf50" stroke-width="2"/>
  <text x="275" y="93" text-anchor="middle" fill="#a5d6a7" font-size="14" font-weight="bold">23</text>
  <rect x="300" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="325" y="93" text-anchor="middle" fill="#90caf9" font-size="14">31</text>
  <rect x="350" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="375" y="93" text-anchor="middle" fill="#90caf9" font-size="14">42</text>
  <rect x="400" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="425" y="93" text-anchor="middle" fill="#90caf9" font-size="14">56</text>
  <rect x="450" y="70" width="50" height="36" rx="3" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="475" y="93" text-anchor="middle" fill="#90caf9" font-size="14">67</text>

  <!-- 索引标注 -->
  <text x="75" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">0</text>
  <text x="125" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">1</text>
  <text x="175" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">2</text>
  <text x="225" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">3</text>
  <text x="275" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">4</text>
  <text x="325" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">5</text>
  <text x="375" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">6</text>
  <text x="425" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">7</text>
  <text x="475" y="122" text-anchor="middle" fill="#5a6a7a" font-size="10">8</text>

  <!-- ============ Step 1 ============ -->
  <text x="50" y="155" fill="#ff7043" font-size="13" font-weight="bold">Step 1</text>
  <text x="120" y="155" fill="#6a7a8a" font-size="12">left=0，right=8，mid=(0+8)/2=4 → arr[4]=</text>
  <text x="470" y="155" fill="#ff7043" font-size="13" font-weight="bold">23</text>
  <text x="495" y="155" fill="#4caf50" font-size="12">✅ 找到了！</text>

  <!-- 高亮 mid=4 -->
  <rect x="250" y="70" width="50" height="36" rx="3" fill="#1a5a3a" stroke="#4caf50" stroke-width="2.5"/>

  <!-- 箭头指向 mid -->
  <line x1="275" y1="108" x2="275" y2="135" stroke="#4caf50" stroke-width="1.5"/>
  <polygon points="270,135 275,142 280,135" fill="#4caf50"/>

  <text x="275" y="148" text-anchor="middle" fill="#4caf50" font-size="11">mid=4</text>

  <!-- ============ 对比：如果找 31 ============ -->
  <line x1="30" y1="175" x2="570" y2="175" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="6,4"/>

  <text x="300" y="195" text-anchor="middle" fill="#5a6a7a" font-size="13">对比：如果目标是 31（未命中情况）</text>

  <text x="50" y="220" fill="#6a7a8a" font-size="12">Step 1：mid=4 → arr[4]=23 &lt; 31，舍弃左半 → left=5</text>
  <text x="50" y="240" fill="#6a7a8a" font-size="12">Step 2：left=5，right=8，mid=(5+8)/2=6 → arr[6]=</text>
  <text x="445" y="240" fill="#ff7043" font-size="13" font-weight="bold">42</text>
  <text x="475" y="240" fill="#6a7a8a" font-size="12"> &gt; 31，舍弃右半 → right=5</text>
  <text x="50" y="260" fill="#6a7a8a" font-size="12">Step 3：left=5，right=5，mid=5 → arr[5]=</text>
  <text x="380" y="260" fill="#ff7043" font-size="13" font-weight="bold">31</text>
  <text x="400" y="260" fill="#4caf50" font-size="12">✅ 找到了！</text>

  <!-- 效率对比 -->
  <rect x="50" y="280" width="500" height="60" rx="6" fill="#1a2a3a" stroke="#4a5a6a" stroke-width="1"/>
  <text x="300" y="303" text-anchor="middle" fill="#b0bec5" font-size="13" font-weight="bold">效率对比</text>
  <text x="300" y="322" text-anchor="middle" fill="#6a7a8a" font-size="11">线性查找：9 个元素 → 最坏查 9 次 ｜ 二分查找：9 个元素 → 最坏查 log₂(9) ≈ 4 次</text>
  <text x="300" y="338" text-anchor="middle" fill="#5a6a7a" font-size="10">100 万个有序元素：线性最坏 100 万次 ｜ 二分最坏 20 次！</text>
</svg>