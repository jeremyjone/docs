<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <text x="150" y="25" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">时间复杂度对比</text>

  <!-- 表格 -->
  <rect x="20" y="40" width="260" height="30" rx="4" fill="#1a3a5c" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="80" y="60" text-anchor="middle" fill="#90caf9" font-size="12" font-weight="bold">大 O</text>
  <text x="200" y="60" text-anchor="middle" fill="#90caf9" font-size="12" font-weight="bold">名称</text>

  <rect x="20" y="72" width="260" height="30" rx="4" fill="#1a3a2a" stroke="#4caf50" stroke-width="1.2"/>
  <text x="80" y="92" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">O(1)</text>
  <text x="200" y="92" text-anchor="middle" fill="#a5d6a7" font-size="12">常数时间 ★</text>

  <rect x="20" y="104" width="260" height="30" rx="4" fill="#1a3a2a" stroke="#4caf50" stroke-width="1.2"/>
  <text x="80" y="124" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">O(log n)</text>
  <text x="200" y="124" text-anchor="middle" fill="#a5d6a7" font-size="12">对数时间 ★</text>

  <rect x="20" y="136" width="260" height="30" rx="4" fill="#1a2a3a" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="80" y="156" text-anchor="middle" fill="#b0bec5" font-size="14" font-weight="bold">O(n)</text>
  <text x="200" y="156" text-anchor="middle" fill="#b0bec5" font-size="12">线性时间</text>

  <rect x="20" y="168" width="260" height="30" rx="4" fill="#1a2a3a" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="80" y="188" text-anchor="middle" fill="#b0bec5" font-size="14" font-weight="bold">O(n log n)</text>
  <text x="200" y="188" text-anchor="middle" fill="#b0bec5" font-size="12">线性对数</text>

  <rect x="20" y="200" width="260" height="30" rx="4" fill="#3a1a1a" stroke="#ff7043" stroke-width="1.2"/>
  <text x="80" y="220" text-anchor="middle" fill="#ffab91" font-size="14" font-weight="bold">O(n²)</text>
  <text x="200" y="220" text-anchor="middle" fill="#ffab91" font-size="12">平方时间</text>

  <rect x="20" y="232" width="260" height="30" rx="4" fill="#3a1a1a" stroke="#ef5350" stroke-width="1.2"/>
  <text x="80" y="252" text-anchor="middle" fill="#ef9a9a" font-size="14" font-weight="bold">O(2ⁿ)</text>
  <text x="200" y="252" text-anchor="middle" fill="#ef9a9a" font-size="12">指数时间 ✗</text>

  <!-- n=100 时的参考 -->
  <text x="150" y="285" text-anchor="middle" fill="#5a6a7a" font-size="11">n=100 时：O(1)=1步  O(log n)≈7步  O(n)=100步</text>
  <text x="150" y="300" text-anchor="middle" fill="#5a6a7a" font-size="11">O(n log n)≈664步  O(n²)=10,000步  O(2ⁿ)=无法计算</text>

  <!-- 建议 -->
  <text x="150" y="328" text-anchor="middle" fill="#6a7a8a" font-size="10">★：高效  ｜  n&lt;10³ 选 O(n²) 可接受  ｜  n&gt;10⁵ 只能 O(n log n) 以下</text>
</svg>