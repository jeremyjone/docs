<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 520">
  <style>text{font-family:system-ui,-apple-system,sans-serif}</style>

  <text x="340" y="25" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">冒泡排序：对 [5, 3, 8, 4, 2] 升序排列</text>

